name: Run Security Tests & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Automated Security & CRUD Tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run 2-Account RLS Security & Data Integrity Test Suite
        run: node tests/security-and-crud.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
